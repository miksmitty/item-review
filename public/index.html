<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item Review</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --border: #e2e5ea; --accent: #2563eb; --sel: #e8effd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --card: #1d222b; --text: #e8eaee; --muted: #98a1b0; --border: #2e3541; --accent: #60a5fa; --sel: #1f2a40; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  button, input, textarea, select { font: inherit; color: inherit; }
  input, textarea, select { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; }
  button { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--card); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 17px; margin-right: auto; }
  .meta { color: var(--muted); font-size: 12px; }
  #app { flex: 1; display: grid; grid-template-columns: var(--leftw, 460px) 6px 1fr; min-height: 0; }
  #left { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--card); }
  #split { cursor: col-resize; background: var(--border); }
  #split:hover, #split.drag { background: var(--accent); }
  #tools { padding: 8px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
  #tools input { flex: 1; min-width: 0; }
  #count { padding: 6px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); background: var(--bg); }
  #count.filtered { color: var(--accent); font-weight: 600; }
  #list { overflow: auto; flex: 1; outline: none; }
  .lhead, .row { display: grid; grid-template-columns: var(--cols); width: max-content; min-width: 100%; }
  .lhead { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--border); }
  .hc { position: relative; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: grab; user-select: none; border-right: 1px solid var(--border); }
  .hc { padding-right: 30px; }
  .fb { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border: 0; background: transparent; color: var(--muted); padding: 0; font-size: 11px; line-height: 20px; border-radius: 4px; display: none; }
  .hc:hover .fb, .fb.on { display: block; }
  .fb:hover { background: var(--border); }
  .fb.on { color: var(--accent); font-weight: 700; background: var(--sel); }
  #fpop { position: fixed; z-index: 50; width: 250px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.35); padding: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  #fpop .mi { padding: 5px 8px; border-radius: 5px; cursor: pointer; }
  #fpop .mi:hover { background: var(--sel); }
  #fpop .vals { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 4px; }
  #fpop label { display: flex; gap: 7px; align-items: center; padding: 2px 4px; cursor: pointer; }
  #fpop label .n { margin-left: auto; color: var(--muted); font-size: 11px; }
  #fpop .btns { display: flex; justify-content: flex-end; gap: 6px; }
  .hc.over-before, .fld.over-before { box-shadow: inset 3px 0 0 var(--accent); }
  .hc.over-after { box-shadow: inset -3px 0 0 var(--accent); }
  .fld.over-before { box-shadow: inset 0 3px 0 var(--accent); }
  .fld.over-after { box-shadow: inset 0 -3px 0 var(--accent); }
  .dragging { opacity: .45; }
  .rh, .lh { position: absolute; top: 0; bottom: 0; right: 0; width: 7px; cursor: col-resize; }
  .rh:hover, .lh:hover, .rh.drag, .lh.drag { background: var(--accent); opacity: .5; }
  .row { border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:hover { background: var(--bg); }
  .row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .cell { padding: 7px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell.id { font-weight: 600; color: var(--accent); }
  #right { overflow-y: auto; padding: 20px 28px 40px; min-height: 0; min-width: 0; --lw: 170px; }
  #right h2 { margin: 0 0 4px; font-size: 20px; }
  .fields { margin: 16px 0; }
  .fld { display: grid; grid-template-columns: 18px var(--lw) 1fr; gap: 0 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .grip { cursor: grab; color: var(--muted); user-select: none; text-align: center; }
  .lbl { position: relative; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding-top: 2px; }
  .lh { right: -7px; }
  .val { white-space: pre-wrap; word-break: break-word; resize: vertical; overflow: auto; min-height: 1.4em; padding-right: 4px; }
  .edit[contenteditable] { border-radius: 4px; outline: none; cursor: text; }
  .edit[contenteditable]:hover { background: var(--bg); }
  .edit[contenteditable]:focus { background: var(--card); box-shadow: 0 0 0 2px var(--accent); }
  .val.rich { white-space: normal; }
  .val.rich p, .val.rich div { margin: 0 0 .5em; }
  .val.rich ul, .val.rich ol { margin: .2em 0; padding-left: 1.4em; }
  .val a { color: var(--accent); }
  .val:empty::before { content: '—'; color: var(--muted); }
  .review { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 14px; }
  .comment { margin: 8px 0; }
  .cform { display: grid; grid-template-columns: 130px 1fr auto; gap: 6px; margin-top: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  /* fields dialog */
  dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); padding: 0; width: min(640px, 94vw); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-h { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .dlg-b { padding: 14px 18px; max-height: 60vh; overflow-y: auto; }
  .dlg-f { padding: 12px 18px; border-top: 1px solid var(--border); text-align: right; }
  .sel2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .sel2 label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  table.f { width: 100%; border-collapse: collapse; }
  table.f th, table.f td { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  table.f th:not(:first-child), table.f td:not(:first-child) { text-align: center; width: 70px; }
  #drop { border: 2px dashed var(--border); border-radius: 12px; margin: 60px auto; padding: 50px; max-width: 520px; text-align: center; color: var(--muted); }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 45% 1fr; } #split { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Item Review</h1>
  <span class="meta" id="info"></span>
  <button id="fieldsBtn" hidden>Fields…</button>
  <button id="exportBtn" hidden title="Download the data, including your edits, as CSV">Export CSV</button>
  <button id="importBtn">Import CSV</button>
  <input type="file" id="file" accept=".csv,text/csv" hidden>
</header>
<div id="empty" hidden><div id="drop">Drop a CSV exported from SharePoint here, or click <b>Import CSV</b>.<br><br><button id="demoBtn">Load demo data</button></div></div>
<div id="app" hidden>
  <section id="left">
    <div id="tools">
      <input id="search" type="search" placeholder="Search all fields…">
      <button id="clearFilters" hidden title="Clear column filters"></button>
    </div>
    <div id="list" tabindex="0"></div>
    <div id="count"></div>
  </section>
  <div id="split" title="Drag to resize"></div>
  <section id="right"></section>
</div>

<dialog id="dlg">
  <div class="dlg-h">Choose fields <span class="meta" style="font-weight:400">· drag list headers and preview grips (⋮⋮) to reorder, drag edges to resize</span></div>
  <div class="dlg-b">
    <div class="sel2">
      <label>ID column<select id="idCol"></select></label>
      <label>Title column<select id="titleCol"></select></label>
    </div>
    <table class="f"><thead><tr><th>Column</th><th>List</th><th>Preview</th></tr></thead><tbody id="fieldRows"></tbody></table>
  </div>
  <div class="dlg-f"><button class="primary" id="dlgClose">Done</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = d => new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
async function send(path, method, body) {
  const res = await fetch('api/' + path, { method: method === 'PUT' ? 'POST' : method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { throw new Error(`Server replied ${res.status} ${res.statusText} to ${path}, not JSON: ${text.slice(0, 160).replace(/\s+/g, ' ')}`); }
}

const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
// ---- SharePoint rich text: cells may contain HTML. Show it safely, search/sort/filter on plain text. ----
const HTML_RE = /<\/?[a-z][a-z0-9]*(\s[^>]*)?>/i;
const isRich = v => HTML_RE.test(String(v ?? ''));
const ALLOWED = new Set(['P', 'DIV', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'SUB', 'SUP', 'UL', 'OL', 'LI', 'A', 'SPAN', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'CODE', 'PRE', 'HR', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH']);
const DROP = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'TEMPLATE', 'HEAD', 'TITLE']);
function sanitizeHTML(html) {   // allow-list rebuild: only known tags, no attributes except safe links
  const doc = new DOMParser().parseFromString(String(html ?? ''), 'text/html');   // inert: nothing runs or loads
  const out = document.createElement('div');
  (function walk(src, dst) {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) dst.appendChild(document.createTextNode(n.textContent));
      else if (n.nodeType === 1 && !DROP.has(n.tagName)) {
        if (!ALLOWED.has(n.tagName)) { walk(n, dst); continue; }
        const e = document.createElement(n.tagName.toLowerCase());
        if (n.tagName === 'A') {
          const href = n.getAttribute('href') || '';
          if (/^(https?:|mailto:)/i.test(href)) { e.href = href; e.target = '_blank'; e.rel = 'noopener noreferrer'; }
        }
        dst.appendChild(e); walk(n, e);
      }
    }
  })(doc.body, out);
  return out.innerHTML;
}
const BLOCKS = new Set(['P', 'DIV', 'LI', 'TR', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'PRE', 'UL', 'OL', 'TABLE', 'HR']);
const plainCache = new Map();
function plain(v) {
  v = String(v ?? '');
  if (!HTML_RE.test(v)) return v;
  if (plainCache.has(v)) return plainCache.get(v);
  let s = '';
  (function walk(n) {
    for (const c of n.childNodes) {
      if (c.nodeType === 3) s += c.textContent;
      else if (c.nodeType === 1 && !DROP.has(c.tagName)) {
        if (c.tagName === 'BR') { s += '\n'; continue; }
        if (c.tagName === 'TD' || c.tagName === 'TH') s += ' ';
        const b = BLOCKS.has(c.tagName);
        if (b && !s.endsWith('\n')) s += '\n';
        walk(c);
        if (b && !s.endsWith('\n')) s += '\n';
      }
    }
  })(new DOMParser().parseFromString(v, 'text/html').body);
  const text = s.replace(/[\u200b\ufeff]/g, '').replace(/\u00a0/g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  plainCache.set(v, text);
  return text;
}

// Excel-style column filters: column -> Set of allowed values (session only)
let colFilters = {};
const cellVal = (r, c) => plain(r[c]);
const passes = (r, skip) => Object.entries(colFilters).every(([c, set]) => c === skip || !dataset.columns.includes(c) || set.has(cellVal(r, c)));
let dataset = null, settings = {}, reviews = {}, selectedId = null, visible = [];

// ---- CSV parsing (RFC 4180: quotes, escaped quotes, embedded newlines) ----
async function readText(f) {
  const buf = new Uint8Array(await f.arrayBuffer());
  if (buf[0] === 0xFF && buf[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if (buf[0] === 0xFE && buf[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  return new TextDecoder('utf-8').decode(buf);
}
function sniffDelimiter(text) {
  const first = text.split(/\r?\n/, 1)[0];
  const n = d => (first.match(new RegExp(d === '\t' ? '\t' : '\\' + d, 'g')) || []).length;
  return [',', ';', '\t', '|'].reduce((best, d) => n(d) > n(best) ? d : best, ',');
}
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const delim = sniffDelimiter(text);
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = ''; rows.push(row); row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v !== ''));
}

function guessColumn(columns, patterns) {
  for (const p of patterns) { const c = columns.find(c => p.test(c)); if (c) return c; }
  return columns[0];
}

async function importFile(f) {
  try { await doImport(f); }
  catch (err) { console.error(err); alert('Import failed: ' + (err.message || err)); }
}
async function doImport(f) {
  const parsed = parseCSV(await readText(f));
  if (parsed.length < 2) throw new Error('That file has no data rows.');
  const seen = {};
  const columns = parsed[0].map((c, i) => {
    let name = c.trim() || `Column ${i + 1}`;
    if (seen[name]) name += ` (${++seen[name]})`; else seen[name] = 1;
    return name;
  });
  const rows = parsed.slice(1).map(r => Object.fromEntries(columns.map((c, i) => [c, r[i] ?? ''])));
  for (let i = 0; i < rows.length; i += 200) {   // chunked so proxies with body-size limits cope
    const saved = await send('dataset', 'POST', { fileName: f.name, columns, rows: rows.slice(i, i + 200), append: i > 0 });
    if (!saved.ok) throw new Error(saved.error || 'The server did not accept the data');
  }
  // Keep field choices if the same columns exist, otherwise guess sensible defaults.
  const keep = settings.idCol && columns.includes(settings.idCol);
  if (!keep) {
    const idCol = guessColumn(columns, [/^id$/i, /\bid\b/i]);
    const titleCol = guessColumn(columns.filter(c => c !== idCol), [/^title$/i, /title|name/i]);
    const others = columns.filter(c => c !== idCol && c !== titleCol);
    settings = { idCol, titleCol, listCols: [idCol, titleCol, ...others.slice(0, 2)], previewCols: others.slice(0, 8), listWidths: {}, previewHeights: {} };
    await send('settings', 'PUT', settings);
  }
  colFilters = {};
  await load();
  if (!keep) openFields();
}

// ---- state ----
async function load() {
  let detail = '';
  try {
    const res = await fetch('api/state');
    const text = await res.text();
    detail = `/api/state replied ${res.status} ${res.statusText}: ${text.slice(0, 120).replace(/\s+/g, ' ')}`;
    ({ dataset, settings, reviews } = JSON.parse(text));
  } catch {
    $('#empty').hidden = false; $('#app').hidden = true; $('#importBtn').hidden = true;
    $('#empty').innerHTML = `<div id="drop"><b>This page isn't being served by the Item Review server.</b><br><br>
      Stop whatever is serving it, then in the project folder run <code>node server.js</code>
      and open <code>http://localhost:3120</code> (or the port the server prints).<br><br><span class="meta">${esc(detail)}</span></div>`;
    return;
  }
  if (dataset && !dataset.columns.includes(settings.idCol)) settings = {};
  if (settings.idCol) {
    const ok = c => dataset.columns.includes(c);
    settings.listCols = (settings.listCols || []).filter(ok);
    settings.previewCols = (settings.previewCols || []).filter(ok);
    settings.listWidths ||= {}; settings.previewHeights ||= {};
  }
  render();
}
const saveSettings = () => send('settings', 'PUT', settings);
const rid = row => String(row[settings.idCol] ?? '');
const listCols = () => settings.listCols.length ? settings.listCols : [settings.idCol];
const widthOf = c => settings.listWidths[c] || (c === settings.idCol ? 100 : 160);
const colsCSS = () => listCols().map(c => widthOf(c) + 'px').join(' ');

function applyLayout() {
  $('#app').style.setProperty('--leftw', (settings.leftWidth || 460) + 'px');
  $('#right').style.setProperty('--lw', (settings.labelWidth || 170) + 'px');
  $('#list').style.setProperty('--cols', colsCSS());
}

function render() {
  const has = !!dataset;
  $('#empty').hidden = has; $('#app').hidden = !has; $('#fieldsBtn').hidden = !has; $('#exportBtn').hidden = !has;
  if (!has) { $('#info').textContent = ''; return; }
  $('#info').textContent = `${dataset.fileName} · ${dataset.rows.length} items`;
  if (!settings.idCol) return openFields();
  applyLayout(); renderList(); renderPreview();
}

function renderList() {
  const q = $('#search').value.trim().toLowerCase();
  visible = dataset.rows.filter(r =>
    (!q || Object.values(r).some(v => plain(v).toLowerCase().includes(q))) && passes(r));
  const total = dataset.rows.length, isFiltered = visible.length !== total;
  $('#count').textContent = isFiltered ? `Showing ${visible.length} of ${total} items` : `${total} items`;
  $('#count').classList.toggle('filtered', isFiltered);
  const nActive = Object.keys(colFilters).filter(c => dataset.columns.includes(c)).length;
  $('#clearFilters').hidden = !nActive; $('#clearFilters').textContent = `Clear filters (${nActive})`;
  if (settings.sortCol && dataset.columns.includes(settings.sortCol)) {
    const dir = settings.sortDir === 'desc' ? -1 : 1, col = settings.sortCol;
    visible.sort((a, b) => dir * collator.compare(plain(a[col]), plain(b[col])));
  }
  if (!visible.some(r => rid(r) === selectedId)) selectedId = visible[0] ? rid(visible[0]) : null;
  const cols = listCols();
  const head = `<div class="lhead">${cols.map(c =>
    `<div class="hc" draggable="true" data-drag="list" data-target="list" data-col="${esc(c)}" title="Click to sort">${esc(c)}${settings.sortCol === c ? (settings.sortDir === 'desc' ? ' ▼' : ' ▲') : ''}<button class="fb ${colFilters[c] ? 'on' : ''}" data-fcol="${esc(c)}" title="Filter and sort">▾</button><span class="rh" data-col="${esc(c)}"></span></div>`).join('')}</div>`;
  const body = visible.map(r => {
    const id = rid(r);
    return `<div class="row ${id === selectedId ? 'sel' : ''}" data-id="${esc(id)}">${cols.map(c =>
      `<div class="cell ${c === settings.idCol ? 'id' : ''}" title="${esc(plain(r[c]))}">${esc(plain(r[c]))}</div>`).join('')}</div>`;
  }).join('');
  $('#list').innerHTML = head + (visible.length ? body : '<div class="empty">No matching items.</div>');
}

const ed = (c, rich) => c === settings.idCol ? '' : rich ? 'contenteditable="true" data-rich="1"' : 'contenteditable="plaintext-only"';
function renderPreview() {
  const row = dataset.rows.find(r => rid(r) === selectedId);
  if (!row) { $('#right').innerHTML = '<div class="empty">Select an item.</div>'; return; }
  const id = rid(row), rv = reviews[id] || { comments: [] };
  $('#right').innerHTML = `
    <div class="meta">${esc(id)}</div><h2 class="edit" ${ed(settings.titleCol)} data-col="${esc(settings.titleCol)}" spellcheck="false">${esc(plain(row[settings.titleCol]))}</h2>
    <div class="fields">${settings.previewCols.map(c => {
      const h = settings.previewHeights[c];
      return `<div class="fld" data-target="preview" data-col="${esc(c)}">
        <span class="grip" draggable="true" data-drag="preview" data-col="${esc(c)}" title="Drag to reorder">⋮⋮</span>
        <div class="lbl">${esc(c)}<span class="lh"></span></div>
        <div class="val edit ${isRich(row[c]) ? 'rich' : ''}" ${ed(c, isRich(row[c]))} spellcheck="false" data-col="${esc(c)}" ${h ? `style="height:${h}px"` : ''}>${isRich(row[c]) ? sanitizeHTML(row[c]) : esc(row[c])}</div></div>`;
    }).join('') || '<div class="meta">No preview fields chosen. Use Fields… to pick some.</div>'}</div>
    <div class="review">
      ${rv.comments.map(c => `<div class="comment"><b>${esc(c.author)}</b> <span class="meta">${fmt(c.created)}</span><br>${esc(c.text)}</div>`).join('')}
      <form class="cform"><input name="author" placeholder="Your name" value="${esc(localStorage.author || '')}">
        <input name="text" placeholder="Add a comment" required><button class="primary">Comment</button></form>
    </div>`;
}

function select(id) {
  selectedId = id;
  document.querySelectorAll('.row').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  document.querySelector('.row.sel')?.scrollIntoView({ block: 'nearest' });
  renderPreview();
}

// ---- Excel-style filter popup ----
function closeFilter() { document.getElementById('fpop')?.remove(); }
function openFilter(btn) {
  const had = document.getElementById('fpop')?.dataset.col === btn.dataset.fcol;
  closeFilter(); if (had) return;
  const c = btn.dataset.fcol, counts = new Map();
  for (const r of dataset.rows) if (passes(r, c)) counts.set(cellVal(r, c), (counts.get(cellVal(r, c)) || 0) + 1);
  const vals = [...counts.keys()].sort(collator.compare);
  const chosen = colFilters[c] || new Set(vals);
  const pop = document.createElement('div');
  pop.id = 'fpop'; pop.dataset.col = c;
  pop.innerHTML = `<div class="mi" data-act="asc">Sort A → Z</div><div class="mi" data-act="desc">Sort Z → A</div>
    <div class="mi" data-act="clear" ${colFilters[c] ? '' : 'style="opacity:.45"'}>Clear filter from “${esc(c)}”</div>
    <input class="q" placeholder="Search values…">
    <div class="vals"><label><input type="checkbox" class="all"> <b>(Select all)</b></label>${vals.map((v, i) =>
      `<label data-t="${esc(v.toLowerCase())}"><input type="checkbox" class="v" data-i="${i}" ${chosen.has(v) ? 'checked' : ''}> ${v ? esc(v.length > 80 ? v.slice(0, 80) + '…' : v) : '(Blanks)'}<span class="n">${counts.get(v)}</span></label>`).join('')}</div>
    <div class="btns"><button data-act="cancel">Cancel</button><button class="primary" data-act="ok">OK</button></div>`;
  document.body.appendChild(pop);
  const r = (btn.closest('.hc') || btn).getBoundingClientRect();
  pop.style.left = Math.max(4, Math.min(r.left, innerWidth - 258)) + 'px';
  pop.style.top = Math.min(r.bottom + 4, innerHeight - pop.offsetHeight - 4) + 'px';
  const boxes = () => [...pop.querySelectorAll('.v')].filter(b => !b.closest('label').hidden);
  const syncAll = () => { pop.querySelector('.all').checked = boxes().length > 0 && boxes().every(b => b.checked); };
  syncAll();
  pop.querySelector('.q').oninput = e => {
    const q = e.target.value.toLowerCase();
    pop.querySelectorAll('.vals label[data-t]').forEach(l => l.hidden = !!q && !l.dataset.t.includes(q));
    syncAll();
  };
  pop.onchange = e => {
    if (e.target.classList.contains('all')) boxes().forEach(b => b.checked = e.target.checked);
    syncAll();
  };
  pop.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
    if (act === 'asc' || act === 'desc') { settings.sortCol = c; settings.sortDir = act; saveSettings(); }
    else if (act === 'clear') delete colFilters[c];
    else if (act === 'ok') {
      const picked = [...pop.querySelectorAll('.v')].filter(b => b.checked).map(b => vals[b.dataset.i]);
      if (picked.length === vals.length) delete colFilters[c]; else colFilters[c] = new Set(picked);
    }
    closeFilter(); renderList(); renderPreview();
  };
  pop.querySelector('.q').focus();
}
document.addEventListener('mousedown', e => { if (!e.target.closest?.('#fpop, .fb')) closeFilter(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFilter(); });
$('#clearFilters').onclick = () => { colFilters = {}; renderList(); renderPreview(); };

// ---- field chooser ----
function openFields() {
  const cols = dataset.columns, opt = v => cols.map(c => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('');
  $('#idCol').innerHTML = opt(settings.idCol); $('#titleCol').innerHTML = opt(settings.titleCol);
  $('#fieldRows').innerHTML = cols.map((c, i) => `<tr><td>${esc(c)}</td>
    <td><input type="checkbox" data-k="listCols" data-c="${i}" ${settings.listCols.includes(c) ? 'checked' : ''}></td>
    <td><input type="checkbox" data-k="previewCols" data-c="${i}" ${settings.previewCols.includes(c) ? 'checked' : ''}></td></tr>`).join('');
  if (!$('#dlg').open) $('#dlg').showModal();
}
$('#idCol').onchange = $('#titleCol').onchange = () => {
  settings.idCol = $('#idCol').value; settings.titleCol = $('#titleCol').value; saveSettings(); applyLayout(); renderList(); renderPreview();
};
$('#fieldRows').onchange = e => {
  const k = e.target.dataset.k; if (!k) return;
  const col = dataset.columns[e.target.dataset.c];
  // newly ticked fields go to the end; drag to reorder afterwards
  settings[k] = e.target.checked ? [...settings[k], col] : settings[k].filter(c => c !== col);
  saveSettings(); applyLayout(); k === 'listCols' ? renderList() : renderPreview();
};
$('#dlgClose').onclick = () => $('#dlg').close();
$('#fieldsBtn').onclick = openFields;

// ---- drag to reorder (list headers, preview fields) ----
let dragging = null;
const clearOver = () => document.querySelectorAll('.over-before,.over-after').forEach(el => el.classList.remove('over-before', 'over-after'));
document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('[data-drag]'); if (!el) return;
  dragging = { kind: el.dataset.drag, col: el.dataset.col };
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', el.dataset.col);
  const shown = el.closest('.fld') || el;
  e.dataTransfer.setDragImage(shown, 10, 10);
  shown.classList.add('dragging');
});
document.addEventListener('dragend', () => { dragging = null; clearOver(); document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging')); });
const afterOf = (e, t) => { const r = t.getBoundingClientRect(); return dragging.kind === 'list' ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2; };
document.addEventListener('dragover', e => {
  const t = dragging && e.target.closest?.('[data-target]');
  if (!t || t.dataset.target !== dragging.kind) return;
  e.preventDefault(); clearOver();
  t.classList.add(afterOf(e, t) ? 'over-after' : 'over-before');
});
document.addEventListener('drop', e => {
  const t = dragging && e.target.closest?.('[data-target]');
  if (!t || t.dataset.target !== dragging.kind) return;
  e.preventDefault();
  const key = dragging.kind + 'Cols', arr = settings[key].filter(c => c !== dragging.col);
  const at = arr.indexOf(t.dataset.col) + (afterOf(e, t) ? 1 : 0);
  arr.splice(at, 0, dragging.col);
  settings[key] = arr; saveSettings(); dragging = null; clearOver();
  key === 'listCols' ? renderList() : renderPreview();
});

// ---- resizing: list columns, preview label column, left/right split, preview field height ----
function startResize(e, handle, onMove) {
  e.preventDefault(); e.stopPropagation();
  handle.classList.add('drag');
  const x0 = e.clientX;
  const move = ev => onMove(ev.clientX - x0);
  const up = () => {
    document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
    handle.classList.remove('drag'); saveSettings();
  };
  document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
}
document.addEventListener('mousedown', e => {
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  if (e.target.classList.contains('rh')) {            // list column width
    const c = e.target.dataset.col, w0 = e.target.parentElement.offsetWidth;
    startResize(e, e.target, dx => { settings.listWidths[c] = clamp(w0 + dx, 40, 900); $('#list').style.setProperty('--cols', colsCSS()); });
  } else if (e.target.classList.contains('lh')) {     // preview label width
    const w0 = settings.labelWidth || 170;
    startResize(e, e.target, dx => { settings.labelWidth = clamp(w0 + dx, 60, 500); $('#right').style.setProperty('--lw', settings.labelWidth + 'px'); });
  } else if (e.target.id === 'split') {               // left/right panes
    const w0 = $('#left').offsetWidth;
    startResize(e, e.target, dx => { settings.leftWidth = clamp(w0 + dx, 200, innerWidth - 300); $('#app').style.setProperty('--leftw', settings.leftWidth + 'px'); });
  }
});
// Native vertical resize on preview values: store any explicit heights when the mouse is released.
document.addEventListener('mouseup', e => {
  if (!e.target.closest?.('#right')) return;
  let changed = false;
  document.querySelectorAll('#right .val').forEach(v => {
    const h = v.style.height ? parseInt(v.style.height) : 0;
    if (h && h !== settings.previewHeights[v.dataset.col]) { settings.previewHeights[v.dataset.col] = h; changed = true; }
  });
  if (changed) saveSettings();
});

// ---- editing item values (preview pane) ----
const csvCell = v => /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
$('#exportBtn').onclick = () => {
  const lines = [dataset.columns, ...dataset.rows.map(r => dataset.columns.map(c => String(r[c] ?? '')))].map(r => r.map(csvCell).join(','));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv' }));
  a.download = dataset.fileName.replace(/\.csv$/i, '') + '-edited.csv';
  a.click(); URL.revokeObjectURL(a.href);
};
$('#right').addEventListener('focusin', e => {
  if (e.target.classList?.contains('edit')) e.target.dataset.orig = e.target.dataset.rich ? e.target.innerHTML : e.target.textContent;
});
const show = (el, v) => { if (el.dataset.rich) el.innerHTML = sanitizeHTML(v); else el.textContent = plain(v); };
$('#right').addEventListener('keydown', e => {
  if (!e.target.classList?.contains('edit')) return;
  if (e.key === 'Escape') { if (e.target.dataset.rich) e.target.innerHTML = e.target.dataset.orig; else e.target.textContent = e.target.dataset.orig; e.target.blur(); }
  else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || e.target.tagName === 'H2')) { e.preventDefault(); e.target.blur(); }
});
$('#right').addEventListener('focusout', async e => {
  const el = e.target; if (!el.classList?.contains('edit') || el.dataset.orig === undefined) return;
  const col = el.dataset.col, id = selectedId, rich = !!el.dataset.rich;
  const row = dataset.rows.find(r => rid(r) === id);
  if (!row) return;
  const cur = String(row[col] ?? '');
  const value = rich ? sanitizeHTML(el.innerHTML) : el.textContent.trim();
  if (value === (rich ? sanitizeHTML(cur) : plain(cur))) { show(el, cur); return; }   // unchanged: keep the original untouched
  row[col] = value; show(el, value);
  document.querySelectorAll('#right .edit').forEach(o => { if (o !== el && o.dataset.col === col) show(o, value); });
  renderList();
  try {
    const res = await send('items/update', 'POST', { id, field: col, value });
    if (!res.ok) throw new Error(res.error || 'Save failed');
  } catch (err) {
    row[col] = cur; alert('Could not save the edit: ' + err.message);
    renderList(); if (selectedId === id) renderPreview();
  }
});

// ---- events ----
$('#demoBtn').onclick = async () => {
  const text = await fetch('sample-items.csv').then(r => r.text());
  importFile(new File([text], 'sample-items.csv'));
};
$('#importBtn').onclick = () => $('#file').click();
$('#file').onchange = e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; };
const drop = $('#drop');
['dragover', 'dragenter'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => { if (e.dataTransfer.files[0]) importFile(e.dataTransfer.files[0]); });
$('#search').oninput = () => { renderList(); renderPreview(); };
$('#list').onclick = e => {
  const fb = e.target.closest('.fb');
  if (fb) return openFilter(fb);
  const h = e.target.closest('.hc');
  if (h && !e.target.classList.contains('rh')) {   // asc -> desc -> unsorted
    const c = h.dataset.col;
    if (settings.sortCol !== c) { settings.sortCol = c; settings.sortDir = 'asc'; }
    else if (settings.sortDir === 'asc') settings.sortDir = 'desc';
    else { delete settings.sortCol; delete settings.sortDir; }
    saveSettings(); return renderList();
  }
  const r = e.target.closest('.row'); if (r) select(r.dataset.id);
};
$('#list').onkeydown = e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const i = visible.findIndex(r => rid(r) === selectedId);
  const n = visible[Math.max(0, Math.min(visible.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
  if (n) select(rid(n));
};
$('#right').onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)); localStorage.author = d.author;
  reviews[selectedId] = await send(`reviews/${encodeURIComponent(selectedId)}/comments`, 'POST', d);
  renderPreview();
};
load();
</script>
</body>
</html>
